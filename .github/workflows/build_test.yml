name: Build and Test Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        run: docker build -t mongo:1.0.0 -f ./mongo/Dockerfile .
      - name: Login to Docker Hub 
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
          
      - name: Docker Scout Scan MongoDB
        uses: docker/scout-action@v1
        with:
          command: recommendations,cves
          image: mongo:1.0.0
          file: ./mongo/Dockerfile
          only-severities: critical,high
          ignore-base: true
          exit-code: true

      - name: Build image for scanning
        run: docker build -t api:1.0.0 -f ./python/Dockerfile .

      - name: Docker Scout Scan API
        uses: docker/scout-action@v1
        with:
          command: recommendations,cves
          image: api:1.0.0
          file: ./python/Dockerfile
          only-severities: critical,high
          exit-code: true

      - name: Trivy Scan MySQL Official Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mysql:9.6
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

  docker-compose:
    needs: build_test
      
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the task
        run: docker compose -f ./compose/docker-compose.yml up -d
        env:
            # MySQL
            MYSQL_ROOT_PASSWORD: ${{secrets.MYSQL_ROOT_PASSWORD}}
            MYSQL_USER: ${{secrets.MYSQL_USER}}
            MYSQL_DATABASE: ynov_ci
            MYSQL_HOST: db
      
            # Mongo
            MONGO_ROOT_USER: ${{secrets.MONGO_ROOT_USER}}
            MONGO_ROOT_PASSWORD: ${{secrets.MONGO_ROOT_PASSWORD}}
            MONGO_DATABASE: blog_db
            MONGO_HOST: mongo
            ME_CONFIG_BASICAUTH: false
      
            # Mongo Express
            ME_CONFIG_MONGODB_SERVER: mongo

      - name: Script vérif conteneurs 
        run: |
          chmod +x ./health_check.sh
          ./health_check.sh
        env:
          COMPOSE_FILE: ./compose/docker-compose.yml
          MAX_WAIT: 120
          POLL_INTERVAL: 5
          MONGO_ROOT_USER: ${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
          MONGO_DATABASE: blog_db

      - name: Test API routes
        run: curl -sf http://localhost:8000/posts && curl -sf http://localhost:8000/users || exit 1
 
  push_to_registry:
    needs: docker-compose
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
 
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./python
          file: ./python/Dockerfile
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/api:latest
 
      - name: Build and push MongoDB image
        uses: docker/build-push-action@v6
        with:
          context: ./mongo
          file: ./mongo/Dockerfile
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/mongo:latest
