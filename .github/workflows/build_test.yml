name: Build and Test Application

on:
  push:
    branches: [job1]
  pull_request:
    branches: [job1]
jobs:
  build_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for scanning
        run: docker build -t mongo:1.0.0 -f ./mongo/Dockerfile .
      - name: Login to Docker Hub 
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
          
      - name: Docker Scout Scan MongoDB
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: mongo:1.0.0
          file: ./mongo/Dockerfile
          only-severities: critical,high
          exit-code: false

      - name: Build image for scanning
        run: docker build -t api:1.0.0 -f ./python/Dockerfile .

      - name: Docker Scout Scan API
        uses: docker/scout-action@v1
        with:
          command: cves,recommendations
          image: api:1.0.0
          file: ./python/Dockerfile
          only-severities: critical,high
          exit-code: false

      - name: Trivy Scan MySQL Official Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mysql:9.6
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: 0

  docker-compose:
    needs: build_test
      
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the task
        run: docker compose -f ./compose/docker-compose.yml up -d
        env:
            # MySQL
            MYSQL_ROOT_PASSWORD: ${{secrets.MYSQL_ROOT_PASSWORD}}
            MYSQL_USER: ${{secrets.MYSQL_USER}}
            MYSQL_DATABASE: ynov_ci
            MYSQL_HOST: db
      
            # Mongo
            MONGO_ROOT_USER: ${{secrets.MONGO_ROOT_USER}}
            MONGO_ROOT_PASSWORD: ${{secrets.MONGO_ROOT_PASSWORD}}
            MONGO_DATABASE: blog_db
            MONGO_HOST: mongo
            ME_CONFIG_BASICAUTH: false
      
            # Mongo Express
            ME_CONFIG_MONGODB_SERVER: mongo
